<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>鎏金时刻 — 动态立绘</title>
<style>
  :root {
    --ink: #fdf6e8;
    --ink-dim: rgba(253, 246, 232, 0.68);
    --night: #14100a;
    --amber: #f0b429;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--night);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  #stage-wrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--night);
  }

  /* 逻辑分辨率 1745x859（原图尺寸）；CSS 定死居中，JS 只算缩放 */
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1745px;
    height: 859px;
    transform-origin: center center;
    overflow: hidden;
    background: #14100a;
  }

  #world {
    position: absolute;
    inset: 0;
    will-change: transform;
    filter: contrast(1.05) saturate(1.05) brightness(1.02);
  }

  /* 呼吸缩放 + 视差都靠外扩 44px 兜底，永不露边 */
  .bg-wrap {
    position: absolute;
    inset: -44px;
    transform-origin: 50% 46%;
    animation: breath 13s ease-in-out infinite alternate;
  }
  @keyframes breath {
    from { transform: scale(1); }
    to   { transform: scale(1.012); }
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* —— 微微动态：发丝飘动（与底图同一变换空间，绝不错位） —— */
  .hair-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    will-change: transform;
    transform-origin: 50% 6.8%; /* 头顶发旋 */
    animation: hairSway 7s ease-in-out infinite;
  }
  @keyframes hairSway {
    0%, 100% { transform: rotate(0deg) translate(0, 0); }
    22% { transform: rotate(1.4deg) translate(7px, 3px); }
    45% { transform: rotate(0.3deg) translate(1px, 0px); }
    68% { transform: rotate(-1.6deg) translate(-8px, 2px); }
    85% { transform: rotate(-0.4deg) translate(-2px, 1px); }
  }

  /* 暖光膜：顶部柔光 */
  .grade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    background:
      linear-gradient(to bottom, rgba(255, 243, 214, 0.14) 0%, rgba(255, 243, 214, 0.05) 22%, transparent 44%);
  }

  /* 缓移的暖雾 */
  .mist {
    position: absolute;
    top: -60px;
    height: 420px;
    width: 900px;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.2;
    background: radial-gradient(ellipse 50% 42% at 50% 50%, rgba(255, 240, 205, 0.75), transparent 70%);
    filter: blur(6px);
    animation: drift 96s linear infinite alternate;
  }
  .mist.m2 { top: -110px; width: 700px; opacity: 0.14; animation-duration: 132s; animation-delay: -40s; }
  @keyframes drift {
    from { transform: translateX(-160px); }
    to   { transform: translateX(320px); }
  }

  /* 主光源（暖金光晕） */
  .glow {
    position: absolute;
    left: 620px;
    top: -330px;
    width: 900px;
    height: 660px;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: screen;
    background: radial-gradient(closest-side, rgba(255, 244, 214, 0.6), rgba(255, 233, 180, 0.26) 46%, transparent 72%);
    animation: sunpulse 7.5s ease-in-out infinite;
  }
  .glow.g2 {
    left: 60px;
    top: -280px;
    width: 560px;
    height: 480px;
    opacity: 0.65;
    animation-delay: -3.2s;
  }
  @keyframes sunpulse {
    0%, 100% { opacity: 0.78; }
    50%      { opacity: 1; }
  }

  /* 光束 */
  .rays {
    position: absolute;
    left: 500px;
    top: -160px;
    width: 1000px;
    height: 720px;
    pointer-events: none;
  }
  .ray {
    position: absolute;
    top: 0;
    width: 84px;
    height: 100%;
    transform-origin: 50% 0;
    mix-blend-mode: screen;
    filter: blur(15px);
    background: linear-gradient(to bottom, rgba(255, 245, 216, 0.45), rgba(255, 245, 216, 0) 76%);
    animation: raypulse 9s ease-in-out infinite;
  }
  @keyframes raypulse {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 0.95; }
  }

  /* 流光尘埃（独立视差层） */
  #life {
    position: absolute;
    left: 0;
    top: 0;
    width: 1745px;
    height: 859px;
    z-index: 4;
    pointer-events: none;
    will-change: transform;
  }

  .vignette {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse 80% 80% at 50% 46%, transparent 56%, rgba(30, 20, 6, 0.4) 100%);
  }

  /* —— UI：在舞台内，竖屏随画面一起旋转 —— */
  #ui {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  .aigc {
    position: fixed;
    left: 50%;
    bottom: 5px;
    transform: translateX(-50%);
    z-index: 150;
    margin: 0;
    font-size: 9px;
    line-height: 1.3;
    font-weight: 400;
    color: rgba(255, 246, 230, 0.55);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
    pointer-events: none;
  }

  .title-block {
    position: absolute;
    left: 12%;
    bottom: 12%;
    max-width: 460px;
    text-shadow: 0 2px 16px rgba(30, 18, 4, 0.8);
  }
  .title-block .song {
    font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }
  .title-block .meta {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
  }
  .title-block .line {
    margin-top: 16px;
    font-family: "Songti SC", "Noto Serif SC", serif;
    font-size: 15px;
    line-height: 1.85;
    color: rgba(253, 246, 232, 0.85);
    min-height: 3.6em;
    transition: opacity 0.45s;
  }

  .badge {
    position: absolute;
    top: 12%;
    left: 12%;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: rgba(253, 246, 232, 0.9);
    border: 1px solid rgba(70, 52, 24, 0.45);
    background: rgba(40, 30, 12, 0.28);
    padding: 6px 12px;
    text-shadow: 0 1px 6px rgba(30, 18, 4, 0.9);
    backdrop-filter: blur(4px);
  }

  .controls {
    position: absolute;
    right: 12%;
    bottom: 12%;
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }

  .btn {
    appearance: none;
    border: 1px solid rgba(253, 246, 232, 0.35);
    background: rgba(24, 17, 8, 0.5);
    color: var(--ink);
    font-size: 12px;
    letter-spacing: 0.16em;
    padding: 10px 18px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: 0.2s;
  }
  .btn:hover {
    border-color: rgba(240, 180, 41, 0.75);
    color: var(--amber);
  }

  #gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    background: rgba(22, 16, 6, 0.78);
    backdrop-filter: blur(8px);
    transition: opacity 0.65s ease, visibility 0.65s;
  }
  #gate.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #gate .card { text-align: center; padding: 40px 48px; }
  #gate h1 {
    font-family: "Songti SC", "Noto Serif SC", serif;
    font-size: 34px;
    letter-spacing: 0.24em;
    font-weight: 600;
    margin-bottom: 12px;
  }
  #gate p {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
    margin-bottom: 28px;
  }
  #gate .hint {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(253, 246, 232, 0.45);
  }

  /* 窄屏（竖屏旋转后舞台缩放约 0.5x）：舞台内 UI 放大补偿 */
  @media (max-width: 600px) {
    .badge { font-size: 15px; padding: 8px 16px; border-width: 2px; }
    .title-block .song { font-size: 38px; }
    .title-block .meta { font-size: 17px; }
    .title-block .line { font-size: 19px; min-height: 3.6em; }
    .btn { font-size: 17px; padding: 14px 24px; letter-spacing: 0.1em; }
    .controls { gap: 14px; }
  }

  /* 竖屏：舞台整体旋转 90°，短边会超出视口，四角 UI 内缩避开裁切 */
  @media (orientation: portrait) {
    .badge { top: 13%; left: 8%; }
    .title-block { bottom: 20%; left: 8%; }
    .controls { bottom: 17%; right: 8%; }
  }
</style>
</head>
<body>
<p data-aigc-mark="1" class="aigc">AI生成</p>

  <div id="stage-wrap">
    <div id="stage">
      <div id="world">
        <div class="bg-wrap">
          <img class="bg" src="assets/bg.jpg" alt="鎏金 · 少女" draggable="false" />
          <div class="hair-layer"><img src="assets/hair.png" alt="" draggable="false" style="display:block;width:100%;height:100%;" /></div>
        </div>
        <div class="grade"></div>
        <div class="mist m1"></div>
        <div class="mist m2"></div>
        <div class="glow g1"></div>
        <div class="glow g2"></div>
        <div class="rays">
          <div class="ray" style="left:40px;  transform:rotate(-14deg); opacity:.5;  animation-delay:-1s;"></div>
          <div class="ray" style="left:180px; transform:rotate(-8deg);  opacity:.65; animation-delay:-3.5s;"></div>
          <div class="ray" style="left:330px; transform:rotate(-3deg);  opacity:.8;  animation-delay:-5s;"></div>
          <div class="ray" style="left:480px; transform:rotate(3deg);   opacity:.7;  animation-delay:-2s;"></div>
          <div class="ray" style="left:630px; transform:rotate(9deg);   opacity:.55; animation-delay:-6.5s;"></div>
          <div class="ray" style="left:780px; transform:rotate(15deg);  opacity:.45; animation-delay:-4.2s;"></div>
        </div>
      </div>

      <canvas id="life" width="1745" height="859"></canvas>
      <div class="vignette"></div>

      <div id="ui">
        <div class="badge">LIVE PORTRAIT</div>
        <div class="title-block">
          <div class="song">鎏金时刻</div>
          <div class="meta">GOLDEN · 动态立绘</div>
          <div class="line" id="lyric-line">她那双鎏金的眼睛里，藏着一整个黄昏。</div>
        </div>
        <div class="controls">
          <button class="btn" id="btn-play" type="button">暂停</button>
          <button class="btn" id="btn-light" type="button">流光</button>
        </div>
      </div>
    </div>
  </div>

  <div id="gate">
    <div class="card">
      <h1>鎏金时刻</h1>
      <p>金瞳微光 · 暖色黄昏</p>
      <button class="btn" id="btn-enter" type="button">进入黄昏</button>
      <div class="hint">点击后音乐自动播放</div>
    </div>
  </div>

  <audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>

<script>
(function () {
  const W = 1745;
  const H = 859;
  const stage = document.getElementById("stage");
  const world = document.getElementById("world");
  const life = document.getElementById("life");
  const bgm = document.getElementById("bgm");
  const gate = document.getElementById("gate");
  const btnEnter = document.getElementById("btn-enter");
  const btnPlay = document.getElementById("btn-play");
  const btnLight = document.getElementById("btn-light");
  const lyricLine = document.getElementById("lyric-line");

  // —— 适配：竖屏整体旋转 90° 全景铺满，横屏 cover 铺满 ——
  // 居中交给 CSS（left/top 50% + translate(-50%,-50%)），不依赖 JS 量窗口；
  // 尺寸取 window 与 visualViewport 的较大值，宁可略大也不留黑边。
  function fitStage() {
    const vvp = window.visualViewport;
    const vw = Math.max(window.innerWidth, vvp ? vvp.width : 0);
    const vh = Math.max(window.innerHeight, vvp ? vvp.height : 0);
    const portrait = vh > vw;
    const bleed = 1.03;

    if (portrait) {
      // 旋转后包围盒为 H x W = 859 x 1745
      const s = Math.max(vw / H, vh / W) * bleed;
      stage.style.transform =
        "translate(-50%,-50%) rotate(90deg) scale(" + s + ")";
      return;
    }

    const s = Math.max(vw / W, vh / H) * bleed;
    stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fitStage);
  window.addEventListener("orientationchange", fitStage);
  window.addEventListener("load", fitStage);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitStage);
  }
  // 地址栏收起 / 初始尺寸报错的延时兜底
  setTimeout(fitStage, 300);
  setTimeout(fitStage, 1200);
  fitStage();

  // —— 视差输入（鼠标 / 触摸） ——
  let pxTarget = 0;
  let pyTarget = 0;
  let px = 0;
  let py = 0;
  function point(x, y) {
    pxTarget = (x / window.innerWidth - 0.5) * 2;
    pyTarget = (y / window.innerHeight - 0.5) * 2;
  }
  window.addEventListener("pointermove", (e) => point(e.clientX, e.clientY));
  window.addEventListener("touchmove", (e) => {
    if (e.touches[0]) point(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  // —— 流光尘埃 ——
  const ctx = life.getContext("2d");
  let lightOn = true;
  function rnd(a, b) { return a + Math.random() * (b - a); }

  const motes = [];
  for (let i = 0; i < 220; i++) {
    motes.push({
      x: rnd(0, W), y: rnd(0, H),
      r: rnd(0.8, 3.4),
      vx: rnd(-6, 10), vy: rnd(-18, -3),
      ph: rnd(0, Math.PI * 2),
      tw: rnd(0.7, 1.8),
    });
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;

    px += (pxTarget - px) * Math.min(1, dt * 3);
    py += (pyTarget - py) * Math.min(1, dt * 3);
    world.style.transform = "translate3d(" + (-px * 14) + "px," + (-py * 10) + "px,0)";
    life.style.transform = "translate3d(" + (-px * 26) + "px," + (-py * 18) + "px,0)";

    ctx.clearRect(0, 0, W, H);
    if (lightOn) {
      ctx.globalCompositeOperation = "lighter";
      for (const m of motes) {
        m.x += (m.vx + Math.sin(t * 0.6 + m.ph) * 4) * dt;
        m.y += m.vy * dt;
        if (m.y < -8) { m.y = H + 8; m.x = rnd(0, W); }
        if (m.x < -8) m.x = W + 8;
        if (m.x > W + 8) m.x = -8;
        const a = 0.28 + 0.58 * (0.5 + 0.5 * Math.sin(t * m.tw + m.ph));
        ctx.fillStyle = "rgba(255, 232, 172," + a.toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // —— 文案轮播 ——
  const lyrics = [
    "她那双鎏金的眼睛里，藏着一整个黄昏。",
    "光落在她发梢上，时间就慢了下来。",
    "她一笑，整个房间都成了蜜色。",
    "琥珀色的眼底，住着没说完的故事。",
    "夕阳不说话，只把轮廓描成金色。",
    "风吹动窗帘，也吹动她鬓边的碎发。",
    "这一刻很长，长得像一整个夏天。",
    "暖光里尘埃起舞，像谁把星星打翻。",
  ];
  let li = 0;
  setInterval(() => {
    li = (li + 1) % lyrics.length;
    lyricLine.style.opacity = 0;
    setTimeout(() => {
      lyricLine.textContent = lyrics[li];
      lyricLine.style.opacity = 1;
    }, 420);
  }, 5400);

  // —— 音乐 ——
  let started = false;
  function playMusic() {
    bgm.volume = 0.85;
    const p = bgm.play();
    if (p && p.catch) p.catch(() => {});
    btnPlay.textContent = "暂停";
    started = true;
  }
  function tryAutoplay() {
    bgm.volume = 0.85;
    const p = bgm.play();
    if (p && p.then) {
      p.then(() => {
        gate.classList.add("hidden");
        started = true;
        btnPlay.textContent = "暂停";
      }).catch(() => {});
    }
  }
  btnEnter.addEventListener("click", () => {
    gate.classList.add("hidden");
    playMusic();
  });
  window.addEventListener("load", () => {
    tryAutoplay();
    setTimeout(tryAutoplay, 250);
  });
  document.addEventListener("pointerdown", () => {
    if (!started) {
      playMusic();
      gate.classList.add("hidden");
    }
  }, { once: true });
  btnPlay.addEventListener("click", (e) => {
    e.stopPropagation();
    if (bgm.paused) playMusic();
    else {
      bgm.pause();
      btnPlay.textContent = "播放";
    }
  });
  btnLight.addEventListener("click", (e) => {
    e.stopPropagation();
    lightOn = !lightOn;
    btnLight.textContent = lightOn ? "流光" : "无光";
    if (!lightOn) ctx.clearRect(0, 0, W, H);
  });
})();
</script>
</body>
</html>
