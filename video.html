<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>鎏金时刻 · 视频</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  video {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100vw; height: 100vh;
    object-fit: cover;
    background: #000;
  }
  /* 竖屏：整段视频旋转 90° 全景铺满（同立绘页） */
  @media (orientation: portrait) {
    video {
      width: 100vh; height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
    }
  }
  .aigc {
    position: fixed; left: 50%; bottom: 5px; transform: translateX(-50%);
    z-index: 60; margin: 0;
    font-size: 9px; line-height: 1.3;
    color: rgba(255, 246, 230, 0.55);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
    pointer-events: none;
  }
  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center;
    background: rgba(22, 16, 6, 0.78);
    backdrop-filter: blur(8px);
    transition: opacity 0.5s ease, visibility 0.5s;
    cursor: pointer;
  }
  #gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #gate .card { text-align: center; padding: 36px 44px; }
  #gate h1 {
    font-family: "Songti SC", "Noto Serif SC", serif;
    font-size: 30px; letter-spacing: 0.22em;
    color: #fdf6e8; margin-bottom: 10px; font-weight: 600;
  }
  #gate p {
    font-size: 12px; letter-spacing: 0.2em;
    color: rgba(253, 246, 232, 0.66); margin-bottom: 26px;
  }
  .btn {
    appearance: none;
    border: 1px solid rgba(253, 246, 232, 0.4);
    background: rgba(24, 17, 8, 0.5);
    color: #fdf6e8;
    font-size: 13px; letter-spacing: 0.16em;
    padding: 11px 26px; cursor: pointer;
    transition: 0.2s;
  }
  .btn:hover { border-color: rgba(240, 180, 41, 0.75); color: #f0b429; }
  .hint { margin-top: 16px; font-size: 11px; letter-spacing: 0.12em; color: rgba(253, 246, 232, 0.42); }
</style>
</head>
<body>
  <video id="v" src="video.mp4" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
  <p data-aigc-mark="1" class="aigc">AI生成</p>

  <div id="gate">
    <div class="card">
      <h1>鎏金时刻</h1>
      <p>轻触屏幕 · 开启有声</p>
      <button class="btn" id="btn" type="button">播放</button>
      <div class="hint">循环播放 · 贴卡即开</div>
    </div>
  </div>

<script>
(function () {
  var v = document.getElementById("v");
  var gate = document.getElementById("gate");
  var btn = document.getElementById("btn");

  function enter() {
    gate.classList.add("hidden");
    v.muted = false;
    var p = v.play();
    if (p && p.catch) {
      p.catch(function () {
        // 浏览器仍拒绝有声播放时，退回静音继续循环
        v.muted = true;
        v.play().catch(function () {});
      });
    }
  }
  btn.addEventListener("click", function (e) { e.stopPropagation(); enter(); });
  gate.addEventListener("click", enter);

  // 静音自动播放先行，画面立刻动起来
  var p0 = v.play();
  if (p0 && p0.catch) p0.catch(function () {});
})();
</script>
</body>
</html>
